<!doctype html>
<!-- ===== DVLP · go.dvlp.app/open (D33, D34a) · the OPEN IN THE APP link's page when the app is not installed =====
     Built by scripts/build-snippets.mjs into web/open.html, which the Pages repo serves as open/index.html. A whole page, not a
     Code Block. It shows nothing of the player and calls no server (D33); the only request is the fonts. Port of mock A12. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DVLP · Open in the app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* The arcade look shared by the quiz, the plan page and go.dvlp.app/open: the full-screen root, resets, type, components and the card.
   Every rule sits under .dvq; keyframes start with dvq-. Included by scripts/build-snippets.mjs. */
/* the root fills the screen whatever padding Squarespace's section adds */
.dvq{
  position:fixed;inset:0;z-index:1000;overflow:hidden;isolation:isolate;
  color-scheme:dark;background:#000;color:#fff;font-family:var(--ui);font-size:16px;line-height:normal;font-weight:400;letter-spacing:normal;text-align:left;text-transform:none;-webkit-text-size-adjust:100%;
  --panel:#17171A; --panel2:#1D1D22; --line:#2A2A30; --shd:#34343C;
  --w:#FFFFFF; --dim:#A1A1A6; --lock:#6E6E73;
  --g:#39FF14; --b:#4DA2F4; --o:#FF7A45; --y:#FFD23F; --blue:#00A6FE;
  --bh:#4DA2F4; --fw:#39FF14; --fn:#FFFFFF; --sh:#FF7A45;
  --ui:'Inter',system-ui,sans-serif; --px:'Press Start 2P','Courier New',monospace;
}
.dvq,.dvq *{box-sizing:border-box}
/* the quiz's own elements carry every value they rely on, so the site's h1/h2/p/button/input styles cannot leak in */
.dvq *{line-height:inherit}
.dvq button{display:inline-block;margin:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;font:inherit;color:inherit;letter-spacing:normal;text-transform:none;text-align:center;text-decoration:none;width:auto;height:auto;min-width:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.dvq input{margin:0;box-shadow:none;letter-spacing:normal;line-height:normal;max-width:none;-webkit-appearance:none;appearance:none}
.dvq h1,.dvq h2{margin:0;font:700 16px/normal var(--ui);color:inherit;letter-spacing:normal;text-transform:none;text-align:inherit}
.dvq p{margin:0;font:400 16px/normal var(--ui);color:inherit;letter-spacing:normal;text-transform:none}
.dvq img{max-width:none}
.dvq button:focus-visible,.dvq input:focus-visible{outline:4px solid var(--y);outline-offset:2px}

/* ---------- pixel type: Press Start 2P only at multiples of its native 8px ---------- */
.dvq .px{font-family:var(--px);letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never;text-transform:uppercase}
.dvq .p8{font-family:var(--px);font-size:8px;line-height:16px}
.dvq .p16{font-family:var(--px);font-size:16px;line-height:24px}
.dvq .p24{font-family:var(--px);font-size:24px;line-height:32px}
.dvq .p32{font-family:var(--px);font-size:32px;line-height:40px}
.dvq .out{text-shadow:4px 4px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.dvq .dim{color:var(--dim)} .dvq .gold{color:var(--g)}

/* ---------- screen ---------- */
.dvq .scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:8px}
.dvq .scr::-webkit-scrollbar{display:none}
.dvq .pad{padding:0 16px}
.dvq canvas.spr{image-rendering:pixelated;display:block}

/* dither backdrops — 16-bit used dithering, not smooth gradients */
.dvq .dith{background-color:#000;background-image:conic-gradient(#0D0D10 25%,transparent 0 50%,#0D0D10 0 75%,transparent 0);background-size:4px 4px}
.dvq .floor{background-color:#26262B;background-image:conic-gradient(#1D1D22 25%,transparent 0 50%,#1D1D22 0 75%,transparent 0);background-size:8px 8px;border-top:4px solid var(--w)}

/* ---------- components ---------- */
.dvq .abtn{display:block;width:100%;min-height:56px;padding:12px 8px;background:var(--b);color:#000;border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);font-family:var(--px);font-size:16px;line-height:24px;text-transform:uppercase}
.dvq .abtn.go{background:var(--g)}
.dvq a.abtn{text-decoration:none;text-align:center}
.dvq .abtn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shd)}
.dvq .lnk:active,.dvq .bk:active,.dvq .chip:active,.dvq .tile:active{filter:brightness(.8)}
.dvq .field.bad{border-color:var(--o)}
.dvq .err{margin:8px 0 0;color:var(--o);font-size:14px;line-height:20px;font-weight:700}
.dvq .abtn:disabled{background:var(--panel2);color:var(--lock);border-color:var(--line);cursor:not-allowed}
.dvq .lnk{display:block;margin:8px auto 0;min-height:44px;padding:0 12px;color:var(--dim);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.dvq .panel{background:var(--panel);border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);padding:12px}
.dvq .tag{display:inline-block;font-family:var(--px);font-size:8px;line-height:16px;padding:4px 8px;background:var(--g);color:#000;border:4px solid #000}
.dvq .bk{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--panel);border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd)}
.dvq .bk svg{width:16px;height:16px}

/* coach speech */
.dvq .bub{position:relative;flex:1;background:#fff;color:#000;padding:12px;font-weight:700;font-size:15px;line-height:20px;border:4px solid #000;box-shadow:4px 4px 0 var(--shd);margin-bottom:32px;min-height:52px}
.dvq .bub:before{content:"";position:absolute;left:-12px;bottom:12px;border:8px solid transparent;border-right:8px solid #000;border-left:0}
.dvq .hop{animation:dvq-hop .48s steps(4)}
@keyframes dvq-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

/* heat meter */
.dvq .heat{flex:1;display:flex;align-items:center;gap:8px}
.dvq .hc{flex:1;display:flex;gap:4px}
.dvq .hc i{flex:1;height:16px;background:var(--panel2);border:4px solid var(--lock)}
.dvq .hc i.on{background:var(--o);border-color:var(--w)}
.dvq .heat.fire .hc i{background:var(--y);border-color:var(--o);animation:dvq-flick .4s steps(2) infinite}
@keyframes dvq-flick{50%{background:var(--o);border-color:var(--y)}}
.dvq .xpc{font-family:var(--px);font-size:8px;line-height:16px;color:var(--g);min-width:56px;text-align:right}

/* option rows */
.dvq .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;padding:8px 12px;margin-bottom:12px;background:var(--panel);border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);font-weight:800;font-size:17px}
.dvq .opt .n{width:32px;height:32px;flex:none;display:grid;place-items:center;background:#000;border:4px solid var(--w);font-family:var(--px);font-size:8px}
.dvq .opt.sel{background:var(--g);color:#000}
.dvq .opt.sel .n{background:#000;color:var(--g)}
.dvq .opt:active{transform:translate(4px,4px);box-shadow:none}

/* rate board */
.dvq .board{margin:0 16px;padding:12px}
.dvq .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
.dvq .cols span{text-align:center;color:var(--dim)}
.dvq .srow{padding:6px 0}
.dvq .srow+.srow{border-top:4px solid var(--line)}
.dvq .shd{display:flex;justify-content:space-between;margin-bottom:6px}
.dvq .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dvq .cells button{height:44px;background:var(--panel2);border:4px solid var(--lock)}
.dvq .cells button.f{background:var(--c);border-color:var(--w)}
.dvq .cells button.f.tip{animation:dvq-stamp .3s steps(3)}
@keyframes dvq-stamp{0%{transform:scaleY(.4)}100%{transform:none}}

/* tape chips — rows of 4+ scroll horizontally */
.dvq .grp{margin:16px 0 0}
.dvq .grp .p8{padding:0 16px;margin-bottom:8px;display:block}
.dvq .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;scroll-padding-inline:16px}
.dvq .chips::-webkit-scrollbar{display:none}
.dvq .chip{flex:none;min-height:48px;padding:0 16px;background:var(--panel);border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);font-weight:800;font-size:15px;white-space:nowrap}
.dvq .chip.on{background:var(--g);color:#000}

/* player select */
.dvq .stage{position:relative;height:248px;margin:8px 16px 0;border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);overflow:hidden}
.dvq .spot{position:absolute;left:50%;top:0;width:200px;margin-left:-100px;height:100%;background:rgba(77,162,244,.22);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.dvq .stage .floor{position:absolute;left:0;right:0;bottom:0;height:56px}
.dvq .stage canvas{position:absolute;left:50%;bottom:20px;transform:translateX(-50%)}
.dvq .plate{position:absolute;left:8px;top:8px;background:#000;border:4px solid var(--w);padding:4px 8px}
.dvq .p1{position:absolute;right:8px;top:8px}
.dvq .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 16px 0}
.dvq .tile{position:relative;height:88px;display:grid;place-items:center;background:var(--panel);border:4px solid var(--lock)}
.dvq .tile.on{border-color:var(--g);background:#000}
.dvq .tile.on:after{content:"1P";position:absolute;left:-4px;top:-4px;background:var(--g);color:#000;font-family:var(--px);font-size:8px;line-height:16px;padding:0 4px;animation:dvq-blink 1s steps(2) infinite}
.dvq .field{width:100%;height:56px;border:4px solid var(--w);background:var(--panel);color:#fff;padding:0 16px;font:inherit;font-size:18px;font-weight:800;text-transform:uppercase;border-radius:0}
.dvq .field::placeholder{color:var(--dim);text-transform:none;font-weight:600}
.dvq .blink{animation:dvq-blink 1s steps(2) infinite}
@keyframes dvq-blink{50%{opacity:0}}

/* title-card screens */
.dvq .center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;text-align:center}

/* card pack (the scan before the flip) */
.dvq .pc{position:relative;width:256px;height:360px;margin:0 auto;perspective:800px}
.dvq .pc>div{position:absolute;inset:0;border:4px solid var(--w);box-shadow:8px 8px 0 var(--shd);backface-visibility:hidden;transition:transform .48s steps(6)}
.dvq .pc .back{display:grid;place-items:center;background-color:#000;background-image:conic-gradient(#17171A 25%,transparent 0 50%,#17171A 0 75%,transparent 0);background-size:16px 16px}
.dvq .pc .back .scan{position:absolute;left:0;right:0;height:4px;background:var(--g);animation:dvq-scan 1.2s steps(12) infinite}
@keyframes dvq-scan{from{top:0}to{top:100%}}

/* plan reveal */
.dvq .hero{position:relative;height:152px;margin:16px 16px 0;border:4px solid var(--w);box-shadow:4px 4px 0 var(--shd);overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;padding:12px;background-color:#0A1A2E;background-image:conic-gradient(rgba(77,162,244,.35) 25%,transparent 0 50%,rgba(77,162,244,.35) 0 75%,transparent 0);background-size:4px 4px}
.dvq .days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 16px 0}
.dvq .dsq{height:56px;display:grid;place-items:center;background:var(--panel2);border:4px solid var(--lock);color:var(--dim)}
.dvq .dsq.cur{background:var(--b);color:#000;border-color:var(--w);animation:dvq-pulse 1s steps(2) infinite}
@keyframes dvq-pulse{50%{background:var(--g)}}
.dvq .dl{display:flex;justify-content:space-between;margin:4px 16px 0}
.dvq .dl span{width:20%;text-align:center}
.dvq .drl{display:flex;gap:12px;align-items:center;min-height:44px}
.dvq .drl+.drl{border-top:4px solid var(--line)}
.dvq .chk{width:24px;height:24px;flex:none;border:4px solid var(--w);background:#000}
.dvq .drl b{font-size:15px;line-height:20px;display:block}
.dvq .drl .p8{display:block}

/* save slot */
.dvq .slot{display:flex;gap:12px;align-items:center;margin:16px 16px 0;padding:12px}

/* overlays: announcer callout + title card */
.dvq .callout{position:absolute;left:-8px;right:-8px;top:34%;z-index:50;pointer-events:none;transform:rotate(-6deg);background:var(--c,var(--g));border-top:8px solid #000;border-bottom:8px solid #000;padding:16px 0;text-align:center;color:#000;animation:dvq-co 1.4s steps(1) forwards}
.dvq .callout span{display:inline-block;animation:dvq-coin 1.4s steps(14) forwards}
@keyframes dvq-co{0%{opacity:1}92%{opacity:1}100%{opacity:0}}
@keyframes dvq-coin{0%{transform:translateX(-420px)}20%{transform:translateX(0)}78%{transform:translateX(0)}100%{transform:translateX(420px)}}
.dvq .tcard{position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;pointer-events:none;animation:dvq-tcx 1.2s steps(1) forwards}
.dvq .tcard .p32,.dvq .tcard .p24{animation:dvq-slam .4s steps(4)}
@keyframes dvq-slam{0%{transform:scale(3);opacity:0}100%{transform:none;opacity:1}}
@keyframes dvq-tcx{0%,90%{opacity:1}100%{opacity:0}}
.dvq .flash{position:absolute;inset:0;z-index:58;background:#fff;pointer-events:none;animation:dvq-fl .32s steps(4) forwards}
@keyframes dvq-fl{from{opacity:.6}to{opacity:0}}
.dvq.shake{animation:dvq-shk .32s steps(4)}
@keyframes dvq-shk{25%{transform:translate(-4px,4px)}50%{transform:translate(4px,-4px)}75%{transform:translate(-4px,-4px)}}
.dvq .pop{position:absolute;left:0;right:0;top:28%;z-index:45;text-align:center;color:var(--g);pointer-events:none;animation:dvq-rise .9s steps(9) forwards}
@keyframes dvq-rise{0%{transform:translateY(16px);opacity:0}20%{opacity:1;transform:none}100%{transform:translateY(-64px);opacity:0}}

@media (prefers-reduced-motion:reduce){.dvq,.dvq *{animation:none!important;transition:none!important}.dvq .callout,.dvq .tcard,.dvq .flash,.dvq .pop{display:none}}

/* ---------- player card (locked 2026-10-08 · playground-card-A1) ---------- */
.dvq .tc{position:relative;width:296px;height:432px;margin:0 auto;perspective:900px;cursor:pointer}
.dvq .tc>.side{position:absolute;inset:0;backface-visibility:hidden;transition:transform .48s steps(6);border:4px solid #000;box-shadow:8px 8px 0 var(--shd)}
.dvq .tc .front{background:var(--tc);padding:8px}
.dvq .tc .back{transform:rotateY(180deg);background:#000;border-color:var(--tc);padding:16px;display:flex;flex-direction:column;gap:8px}
.dvq .tc.flip .front{transform:rotateY(-180deg)} .dvq .tc.flip .back{transform:none}
.dvq .foil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 40%,rgba(255,255,255,.35) 40% 46%,transparent 46% 52%,rgba(255,255,255,.2) 52% 55%,transparent 55%);background-size:300% 100%;animation:dvq-foil 2.4s steps(12) infinite;mix-blend-mode:screen}
@keyframes dvq-foil{from{background-position:100% 0}to{background-position:-50% 0}}
.dvq .tc .inner{position:relative;height:100%;border:4px solid #000;background:#000;display:flex;flex-direction:column}
.dvq .tc .portrait{position:relative;flex:1;overflow:hidden;border-bottom:4px solid #000}
.dvq .tc .portrait .spot{position:absolute;left:50%;top:0;width:220px;margin-left:-110px;height:100%;background:rgba(255,255,255,.12);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.dvq .tc .portrait .floor{position:absolute;left:0;right:0;bottom:0;height:56px}
.dvq .tc .portrait canvas{position:absolute;left:50%;bottom:24px;transform:translateX(-50%)}
.dvq .ovr{position:absolute;left:8px;top:8px;z-index:2;width:72px;padding:8px 0;background:#000;border:4px solid var(--w);text-align:center}
.dvq .postag{position:absolute;right:8px;top:8px;z-index:2}
.dvq .nameband{background:var(--w);color:#000;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.dvq .tierband{background:var(--tc);color:#000;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.dvq .flipcue{display:none}
.dvq .meter{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;height:16px}
.dvq .meter i{background:var(--panel2);border:2px solid var(--lock)}
.dvq .meter i.on{background:var(--c);border-color:var(--c)}
.dvq .tc{height:440px}
.dvq .tc .back{padding:0;gap:0}
.dvq .bk-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--tc);color:#000}
.dvq .bk-id{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border-bottom:4px solid var(--line)}
.dvq .bk-id .mini{height:72px;display:grid;place-items:end center;background:var(--panel);border:4px solid var(--w);overflow:hidden}
.dvq .bio{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:baseline}
.dvq .bio b{font-size:14px;line-height:18px;font-weight:800}
.dvq .bk-sec{padding:8px 12px;border-bottom:4px solid var(--line)}
.dvq .bk-sec .p8.h{display:block;margin-bottom:6px}
.dvq .mrow{display:grid;grid-template-columns:88px 1fr 24px;gap:8px;align-items:center;margin-top:6px}
.dvq .career{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.dvq .career div+div{border-left:4px solid var(--line)}
.dvq .career b{display:block;font-family:var(--px);font-size:16px;line-height:24px}
.dvq .bk-foot{display:flex;justify-content:space-between;padding:6px 12px;margin-top:auto}

/* ---------- 1008-5: the coach leads every screen ---------- */
.dvq .lead{display:flex;align-items:flex-end;gap:8px;padding:8px 16px 0}
.dvq .lead .bk{flex:none;align-self:flex-start}
.dvq .lead .lc,.dvq .lead .lp{flex:none}
.dvq .bub.ld{flex:1;margin:0 0 8px 8px;min-height:48px;padding:10px 12px}
.dvq .stat{display:flex;align-items:center;gap:12px;height:32px;margin:4px 16px 8px;border-bottom:4px solid var(--line)}
.dvq .stat .heat{flex:1}.dvq .stat .hc i{height:12px}
.dvq .hero.sm{height:104px;margin-top:8px}
.dvq .days.sm{margin-top:8px}.dvq .days.sm .dsq{height:44px}
.dvq .drl.sm{min-height:40px}
.dvq .pos4{display:flex;align-items:center;gap:8px;margin:6px 16px 0}
.dvq .pos4 .p8{flex:1}
.dvq .pos4 .chip{min-height:44px;padding:0 12px}

/* ---------- 1008-1: the web page ---------- */
.dvq .site{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 16px;background:#000;border-bottom:4px solid var(--line)}
.dvq .site img{height:32px;width:auto;display:block}
.dvq .legal{margin:8px 0 0;font:600 14px/20px var(--ui);color:var(--dim);text-align:center}
/* a 3-step track (D33): the step the player is on is lit in the logo blue */
.dvq .track3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
.dvq .track3 div{min-height:72px;padding:8px;background:var(--panel2);border:4px solid var(--lock);color:var(--dim);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.dvq .track3 div.on{background:var(--blue);border-color:var(--w);color:#000}
.dvq .snd{flex:none}
/* A4 declares .note twice and the second wins, on the landing and the card back alike */
.dvq .note{font-size:14px;line-height:20px;font-weight:600;text-align:center;margin:12px 0 0}
.dvq .lockcard{align-items:center}
.dvq .conf{margin:12px 16px 0;border-color:var(--g)}
.dvq .conf p{margin:6px 0 0;font-size:15px;line-height:21px;font-weight:600}
/* the card laid out flat and out of sight while cardImages() paints it (no flip, no animation) */
.dvq .cardshot{position:fixed;left:-10000px;top:0;width:296px;pointer-events:none}
.dvq .cardshot .tc>.side{transform:none;transition:none}
.dvq .cardshot .foil{display:none}

/* on a laptop the phone column sits centred on the dithered page */
.dvq .col{position:absolute;top:0;bottom:0;left:50%;width:min(100%,480px);transform:translateX(-50%)}
</style>

<noscript><p style="position:fixed;inset:auto 0 0;z-index:1001;margin:0;padding:16px;background:#000;font:600 16px/24px system-ui,sans-serif;text-align:center"><a href="https://apps.apple.com/app/id6741947450" style="color:#39FF14">Get the DVLP app on the App Store</a></p></noscript>
<script>
(function(){
const root=document.querySelector('.dvq');
/* The one list of allowed quiz answers (training-plans I R6a). The build includes it in the quiz, the plan page and
   apps-script/Code.gs, so browser and server check against the same values. A11: height in inches, age instead of grade. */
var ANSWERS = {
  PLAYERS: [8, 9, 10, 11, 12, 13],
  OLD_PLAYERS: [1, 1, 2, 2, 4, 4, 5, 5], /* old 0–7 are still stored, so each draws its nearest cast member (research/1014-2) */
  GOALS: ['Make the team', 'Earn more minutes', 'Play in college', 'Go pro'],
  /* every inch from 4'0" to 7'2"; the ends stand for shorter and taller (quiz-landing §15.7) */
